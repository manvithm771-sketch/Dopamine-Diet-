name: Build Mindful Native Android APK

concurrency:
  group: mindful-apk-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.14.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.2'

      - name: Run Android release lint
        id: android_lint
        run: gradle -p android :app:lintRelease --console=plain --stacktrace
        continue-on-error: true

      - name: Run native unit and migration tests
        run: gradle -p android :app:testDebugUnitTest

      - name: Build native release APK
        run: gradle -p android :app:assembleRelease

      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: Mindful-native-release-APK
          path: build/app/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload generated Room schema
        uses: actions/upload-artifact@v4
        with:
          name: Mindful-room-schema
          path: android/app/schemas/**/*.json
          if-no-files-found: warn

      - name: Upload Android lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mindful-android-lint-reports
          path: |
            build/app/reports/lint-results-release.html
            build/app/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt
          if-no-files-found: warn

      - name: Enforce Android lint result
        if: always() && steps.android_lint.outcome == 'failure'
        run: |
          echo "Android release lint failed. Download Mindful-android-lint-reports to inspect the findings."
          exit 1
