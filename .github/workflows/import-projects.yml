name: Import both Android projects

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-projects.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out workspace
        uses: actions/checkout@v4
        with:
          path: workspace

      - name: Check out Dopamine Diet source
        uses: actions/checkout@v4
        with:
          repository: manvithm771-sketch/Dopamine-Diet
          ref: main
          path: sources/dopamine-diet

      - name: Check out Mindful source
        uses: actions/checkout@v4
        with:
          repository: manvithm771-sketch/Mindful
          ref: main
          path: sources/mindful

      - name: Copy complete project contents
        run: |
          mkdir -p workspace/Dopamine-Diet workspace/Mindful
          cp -a sources/dopamine-diet/. workspace/Dopamine-Diet/
          cp -a sources/mindful/. workspace/Mindful/
          rm -rf workspace/Dopamine-Diet/.git workspace/Mindful/.git

      - name: Commit imported projects
        working-directory: workspace
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to import."
          else
            git commit -m "Import Dopamine Diet and Mindful project sources"
            git push
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
