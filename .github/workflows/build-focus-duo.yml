name: Build Focus Duo APK

on:
  push:
    branches:
      - main
    paths:
      - "UnifiedApp/**"
      - "Dopamine-Diet/**"
      - "Mindful/**"
      - ".github/workflows/build-focus-duo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build unified debug APK
        run: gradle -p UnifiedApp :app:assembleDebug --stacktrace --console=plain

      - name: Locate generated APK
        shell: bash
        run: |
          echo "Searching for APK files under UnifiedApp..."
          find UnifiedApp -type f -name "*.apk" -print
          APK_COUNT=$(find UnifiedApp -type f -name "*.apk" | wc -l)
          echo "APK_COUNT=$APK_COUNT"
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::Gradle reported success, but no APK file exists under UnifiedApp."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Focus-Duo-debug-apk
          path: |
            UnifiedApp/**/*.apk
          if-no-files-found: error
          retention-days: 14
