name: Build Focus Duo APK

on:
  push:
    branches:
      - main
    paths:
      - "UnifiedApp/**"
      - "Dopamine-Diet/**"
      - "Mindful/**"
      - ".github/workflows/build-focus-duo.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build unified debug APK
        run: gradle -p UnifiedApp :app:assembleDebug --stacktrace --console=plain

      - name: Locate generated APK
        id: apk
        shell: bash
        run: |
          echo "Searching for APK files under UnifiedApp..."
          find UnifiedApp -type f -name "*.apk" -print
          APK_PATH=$(find UnifiedApp -type f -name "*.apk" -print -quit)
          if [ -z "$APK_PATH" ]; then
            echo "::error::Gradle completed but no APK file exists under UnifiedApp."
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK_PATH"

      - name: Publish APK as a GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="focus-duo-debug-${{ github.run_number }}-${{ github.run_attempt }}"
          gh release create "$TAG" "${{ steps.apk.outputs.apk_path }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Focus Duo Debug APK - Run ${{ github.run_number }}" \
            --notes "Automatically built debug APK from commit ${{ github.sha }}."
