name: Build Dopamine Diet APK

on:
  push:
    branches:
      - main
    paths:
      - "UnifiedApp/**"
      - "Dopamine-Diet/**"
      - "Mindful/**"
      - ".github/workflows/build-focus-duo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and upload debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build unified debug APK
        run: gradle -p UnifiedApp :app:assembleDebug --stacktrace --console=plain

      - name: Verify generated APK
        shell: bash
        run: |
          APK_PATH="UnifiedApp/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK_PATH" ]; then
            echo "::error::Expected APK was not generated at $APK_PATH"
            echo "Available APK files:"
            find UnifiedApp -type f -name "*.apk" -print || true
            exit 1
          fi
          echo "APK verified: $APK_PATH"
          ls -lh "$APK_PATH"

      - name: Upload APK to workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dopamine-Diet-debug-apk
          path: UnifiedApp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
