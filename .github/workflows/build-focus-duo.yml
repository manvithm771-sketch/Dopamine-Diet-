name: Build Dopamine Diet APK

on:
  push:
    branches:
      - main
    paths:
      - "UnifiedApp/**"
      - "Dopamine-Diet/**"
      - "Mindful/**"
      - ".github/workflows/build-focus-duo.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build and upload debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build unified debug APK
        run: gradle -p UnifiedApp :app:assembleDebug --stacktrace --console=plain

      - name: Verify generated APK
        shell: bash
        run: |
          APK_PATH="UnifiedApp/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK_PATH" ]; then
            echo "::error::Expected APK was not generated at $APK_PATH"
            echo "Available APK files:"
            find UnifiedApp -type f -name "*.apk" -print || true
            exit 1
          fi
          echo "APK verified: $APK_PATH"
          ls -lh "$APK_PATH"

      # Keep only the latest APK artifact for this repository.
      # This does not touch artifacts belonging to other workflows or repositories.
      - name: Remove previous Dopamine Diet APK artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const artifactName = "Dopamine-Diet-debug-apk";
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );
            const previous = artifacts.filter(
              artifact => artifact.name === artifactName
            );

            for (const artifact of previous) {
              core.info(`Deleting previous ${artifact.name} artifact #${artifact.id} (${artifact.size_in_bytes} bytes)`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id
              });
            }

            core.info(`Removed ${previous.length} previous Dopamine Diet APK artifact(s).`);

      - name: Upload APK to workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dopamine-Diet-debug-apk
          path: UnifiedApp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
