name: Build Dopamine Diet APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - integration/unified-dopamine-diet

permissions:
  contents: read

concurrency:
  group: dopamine-diet-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.2'

      - name: Run unit tests
        run: gradle test --no-daemon --stacktrace

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dopamine-Diet-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
